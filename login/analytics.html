<!DOCTYPE html>
<html lang="zh-TW">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<meta name="robots" content="noindex,nofollow">
	<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
	<meta http-equiv="Pragma" content="no-cache">
	<meta http-equiv="Expires" content="0">
	<title>分析儀表板 | 鬼磕頭</title>
	<link rel="icon" href="https://spiritref.github.io/GhostKowtow.ico" type="image/x-icon">
	<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
	<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
	<script src="https://unpkg.com/leaflet.heat@0.2.0/dist/leaflet-heat.js"></script>
	<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
	<link rel="stylesheet" href="https://spiritref.github.io/CSS/global.css">
	<style>
		body { font-family: "PingFang TC", "Microsoft JhengHei", sans-serif; background: #f8f9fa; padding: 0; margin: 0; color: #3e2723; }
		.analytics-layout { position: relative; min-height: 100vh; }
		.sidebar { position: fixed; top: 0; left: 0; bottom: 0; width: 170px; overflow-y: auto; z-index: 50; transition: transform 0.3s ease; }
		.main-content { margin-left: 170px; padding: 24px; overflow-x: auto; min-height: 100vh; }
		.menu-toggle { display: none; position: fixed; top: 14px; left: 14px; z-index: 70; width: 44px; height: 44px; border: none; border-radius: 8px; background: rgba(255,255,255,0.95); color: #4a2e1b; box-shadow: 0 2px 8px rgba(0,0,0,0.25); cursor: pointer; font-size: 22px; line-height:1; align-items: center; justify-content: center; }
		.menu-toggle:hover { background: #fff; }
		#menuOverlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 60; }
		.sidebar { background: linear-gradient(180deg, #f7ebd7 0%, #e6d3af 100%); border-right: 1px solid #dcbfa2; padding: 20px 10px; display:flex; flex-direction:column; gap:8px; }
		.sidebar h1 { font-size: 16px; color: #4a2e1b; margin: 0 0 10px 4px; }
		.sidebar-btn { display: block; width: 100%; text-align: left; padding: 10px 12px; border: none; background: transparent; border-radius: 8px; cursor: pointer; font-family: inherit; font-weight: bold; color: #5c4332; margin-bottom: 2px; transition: all 0.2s; }
		.sidebar-btn:hover { background: rgba(139, 115, 85, 0.1); }
		.sidebar-btn.active { background: #8b7355; color: #fff; }
		.card { background: rgba(255,255,255,0.7); border: 1px solid #dcbfa2; border-radius: 12px; padding: 20px; margin-bottom: 20px; overflow: hidden; }
		h2 { color: #4a2e1b; margin: 0 0 14px; font-size: 18px; }
		h3 { color: #4a2e1b; margin: 0 0 6px; font-size: 15px; }
		.unit { font-size: 12px; color: #8b7355; margin: -8px 0 12px; }
		.stats { display:grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 12px; margin-bottom: 18px; }
		.stat { background: rgba(255,255,255,0.85); border: 1px solid #dcbfa2; border-radius: 10px; padding: 14px; text-align:center; }
		.stat .value { font-size: 1.8em; font-weight: 900; color: #8b7355; }
		.stat .label { font-size: 11px; color: #5c4332; margin-top: 2px; }
		.chart-wrap { background: rgba(255,255,255,0.8); border: 1px solid #dcbfa2; border-radius: 10px; padding: 14px; position:relative; height:300px; margin-bottom:18px; }
		.page-detail { background: rgba(255,255,255,0.92); border: 1px solid #dcbfa2; border-radius: 10px; padding: 14px; margin: -8px 0 18px; }
		.page-detail-header { display:flex; justify-content:space-between; align-items:center; gap:10px; margin-bottom:10px; flex-wrap:wrap; }
		.page-detail-header strong { color:#4a2e1b; font-size:14px; }
		.page-detail-close { border:1px solid #dcbfa2; background:#fff; color:#b04a3a; border-radius:6px; padding:5px 12px; cursor:pointer; font-family:inherit; font-weight:bold; }
		.page-detail-close:hover { background:#fdf0ee; }
		.page-detail-scroll { max-height: 420px; overflow-y:auto; }
		.page-detail th { white-space: nowrap; }
		.page-detail td:first-child { word-break: break-word; }
		.page-detail tfoot th { background:#faf6f0; color:#4a2e1b; border-bottom:none; }
		.map-wrap { position: relative; z-index: 0; height: 360px; border-radius: 10px; overflow: hidden; border: 1px solid #dcbfa2; }
		#map { width: 100%; height: 100%; }
		.grid-2 { display: grid; grid-template-columns: 1.5fr 1fr; grid-template-areas: "trend geo" "pages geo"; gap: 20px; align-items: start; }
		.trend-block { grid-area: trend; min-width: 0; }
		.pages-block { grid-area: pages; min-width: 0; }
		.geo-block { grid-area: geo; min-width: 0; }
		.geo-btn { cursor: pointer; font-family: inherit; transition: all 0.15s; }
		.geo-btn:hover { background: #e8e0d0; border-color: #8b7355; }
		.geo-btn[disabled] { opacity: 0.55; cursor: default; }
		.geo-btn[disabled]:hover { background: rgba(255,255,255,0.8); border-color: #dcbfa2; }

		.rank-list { list-style:none; padding:0; }
		.rank-item { background: rgba(255,255,255,0.8); border:1px solid #dcbfa2; border-radius:8px; padding:10px 12px; margin-bottom:10px; display:flex; gap:12px; align-items:flex-start; }
		.rank-num { background:#8b7355; color:#fff; width:28px; height:28px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-weight:bold; flex-shrink:0; font-size:13px; }
		.rank-body { flex:1; min-width:0; }
		.rank-title { font-weight:bold; color:#4a2e1b; margin-bottom:2px; }
		.rank-desc { font-size:13px; color:#5c4332; margin-bottom:6px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
		.rank-meta { font-size:12px; color:#8b7355; }
		.rank-meta a { color:#8b7355; text-decoration:none; font-weight:bold; }
		.rank-meta a:hover { text-decoration:underline; }
		table.data { width:100%; border-collapse:collapse; font-size:14px; }
		table.data th, table.data td { border-bottom:1px solid #eee; padding:8px; text-align:left; vertical-align:top; }
		table.data th { background:#faf6f0; color:#4a2e1b; }
		.toolbar { display:flex; gap:8px; margin-bottom:12px; flex-wrap:wrap; align-items:center; }
		.toolbar label { font-size:13px; color:#4a2e1b; }
		.toolbar select, .toolbar button { padding:7px 12px; border:1px solid #dcbfa2; border-radius:6px; cursor:pointer; font-family:inherit; color:#4a2e1b; background:#fff; font-weight:bold; }
		.toolbar button:hover { border-color:#8b7355; }
		.visitor-group { border: 1px solid #dcbfa2; border-radius: 8px; margin-bottom: 12px; overflow: hidden; }
		.visitor-header { background: #faf6f0; padding: 8px 12px; cursor: pointer; display:flex; align-items:center; gap:10px; row-gap:4px; flex-wrap:wrap; font-weight:bold; color:#4a2e1b; user-select:none; line-height:1.5; }
		.visitor-header:hover { background: #f0ece4; }
		.visitor-header > span:nth-child(2) { min-width: 140px; }
		.visitor-body { border-top: 1px solid #dcbfa2; padding: 8px 12px; display:none; background: rgba(255,255,255,0.6); }
		.visitor-body.open { display:block; }
		.visitor-event { padding:4px 0; border-bottom:1px dashed #eee; display:flex; gap:10px; font-size:13px; align-items:baseline; flex-wrap:wrap; }
		.visitor-event:last-child { border-bottom:none; }
		.ev-link { color:#8b7355; font-weight:bold; text-decoration:none; word-break:break-all; }
		.ev-link:hover { text-decoration:underline; }
		.from-tag { background:#b04a3a; color:#fff; padding:2px 6px; border-radius:4px; font-size:11px; }
		.visitor-meta { padding:2px 2px 8px; border-bottom:1px dashed #eee; margin-bottom:8px; font-size:12px; color:#8b7355; display:flex; gap:14px; flex-wrap:wrap; }
		.path-tag { background:#8b7355; color:#fff; padding:2px 6px; border-radius:4px; font-size:11px; }
		.geo-list { display:flex; flex-wrap:wrap; gap:10px; margin-top:12px; }
		.geo-pill { background: rgba(255,255,255,0.8); border:1px solid #dcbfa2; padding:4px 10px; border-radius:6px; font-size:12px; }
		.map-footer { margin-top:12px; font-size:13px; color:#5c4332; }
		.map-footer strong { color:#4a2e1b; }
		.back-admin { margin-top:auto; padding-top:16px; border-top:1px solid #dcbfa2; }
		.back-admin .sidebar-btn { color:#8b7355; }
		.back-admin .sidebar-btn:hover { background: rgba(139, 115, 85, 0.1); }
		.back-admin .logout { color:#b04a3a; }
		.back-admin .logout:hover { background: rgba(176, 74, 58, 0.1); }

		/* 手機版響應式（需在基底規則之後，利用 cascade 覆蓋） */
		@media (max-width: 900px) {
			.sidebar { width: 240px; transform: translateX(-100%); box-shadow: 4px 0 12px rgba(0,0,0,0.15); }
			/* 手機版內容區固定 500px 寬：圖表/地圖較大，可往右滑看完整內容 */
			.main-content { margin-left: 0; padding: 64px 16px 24px; min-width: 500px; overflow-x: visible; box-sizing: border-box; }
			.menu-toggle { display: flex; }
			.analytics-layout.menu-open .sidebar { transform: translateX(0); }
			.analytics-layout.menu-open #menuOverlay { display: block; }
			.grid-2 { grid-template-columns: 1fr; grid-template-areas: "trend" "geo" "pages"; }
		}
	</style>
</head>
<body>
<button id="menuToggle" class="menu-toggle" aria-label="切換選單">☰</button>
<div id="menuOverlay"></div>

<div class="analytics-layout">
	<!-- 左側選單 -->
	<aside class="sidebar">
		<h1>📈 分析</h1>
		<button class="sidebar-btn active" data-panel="panelOverview">🏠 總覽</button>
		<button class="sidebar-btn" data-panel="panelArticles">🔥 熱門文章</button>
		<button class="sidebar-btn" data-panel="panelCompendium">📖 熱門彙典</button>
		<button class="sidebar-btn" data-panel="panelRecent">📑 最近事件</button>
		<button class="sidebar-btn" data-panel="panelVisitors">👤 訪客</button>
		<div class="back-admin">
			<button class="sidebar-btn" onclick="location.href='./admin.html'">↩ 回管理後台</button>
			<button class="sidebar-btn logout" id="logoutBtn">🚪 登出</button>
		</div>
	</aside>

	<!-- 右側主內容 -->
	<main class="main-content">
		<div id="adminUser" style="font-size:12px;color:#8b7355;margin-bottom:12px;">驗證登入中...</div>

		<div class="toolbar">
			<label for="rangeSelect">時間範圍</label>
			<select id="rangeSelect">
				<option value="7">最近 7 天</option>
				<option value="30">最近 30 天</option>
				<option value="90">最近 90 天</option>
			</select>
			<button id="reloadBtn">🔄 重新載入</button>
		</div>

		<!-- 總覽 -->
		<section id="panelOverview" class="panel active">
			<div class="stats">
				<div class="stat"><div class="value" id="totalViews">-</div><div class="label">總瀏覽量（次）</div></div>
				<div class="stat"><div class="value" id="uniqueVisitors">-</div><div class="label">不重複訪客（人）</div></div>
				<div class="stat"><div class="value" id="uniquePages">-</div><div class="label">不重複頁面（頁）</div></div>
				<div class="stat"><div class="value" id="totalStay">-</div><div class="label">總停留秒數（秒）</div></div>
				<div class="stat"><div class="value" id="avgStay">-</div><div class="label">平均停留（秒）</div></div>
				<div class="stat"><div class="value" id="todayViews">-</div><div class="label">今日瀏覽（次）</div></div>
			</div>
			<div class="grid-2">
				<div class="trend-block">
					<h3>每日瀏覽量（次）</h3>
					<div class="chart-wrap"><canvas id="trendChart"></canvas></div>
				</div>
				<div class="geo-block">
					<h3 style="margin-bottom:8px;">🌍 訪客地理分佈（人數）</h3>
					<div class="card" style="margin-bottom:0;">
						<div class="map-wrap"><div id="map"></div></div>
						<div class="map-footer" style="margin-top:12px;"><strong>各城市訪客數（人）</strong></div>
						<div class="geo-list" id="geoList"></div>
					</div>
				</div>
				<div class="pages-block">
					<h3>頁面瀏覽分佈（次）</h3>
					<div class="chart-wrap"><canvas id="topPagesChart"></canvas></div>
					<div class="unit" style="margin-top:6px;">💡 點擊柱狀圖可查看該分類的頁面明細</div>
					<div id="topPagesDetail" class="page-detail" style="display:none;">
						<div class="page-detail-header">
							<strong id="topPagesDetailTitle"></strong>
							<button id="topPagesDetailClose" class="page-detail-close" type="button">✕ 關閉</button>
						</div>
						<div id="topPagesDetailBody"></div>
					</div>
				</div>
			</div>
		</section>

		<!-- 熱門文章 -->
		<section id="panelArticles" class="panel" style="display:none;">
			<div class="card">
				<h2>🔥 熱門文章 Top 100</h2>
				<div id="topArticles"></div>
			</div>
		</section>

		<!-- 熱門彙典 -->
		<section id="panelCompendium" class="panel" style="display:none;">
			<div class="card">
				<h2>📖 熱門彙典 Top 100</h2>
				<div id="topCompendium"></div>
			</div>
		</section>

		<!-- 最近事件 -->
		<section id="panelRecent" class="panel" style="display:none;">
			<div class="card">
				<h2>📑 最近事件（最近 100 筆）</h2>
				<div style="overflow-x:auto;"><table class="data" id="eventTable"><thead><tr><th>時間</th><th>事件</th><th>頁面</th><th>停留秒數</th><th>位置</th><th>訪客</th></tr></thead><tbody id="eventRows"><tr><td colspan="6">載入中...</td></tr></tbody></table></div>
			</div>
		</section>

		<!-- 訪客 -->
		<section id="panelVisitors" class="panel" style="display:none;">
			<div class="card">
				<h2>👤 不重複訪客（個）</h2>
				<div class="stat" style="margin-bottom:16px;max-width:240px;">
					<div class="value" id="uniqueVisitorsLarge">-</div>
					<div class="label">不重複 session 數（人）</div>
				</div>
				<div id="visitorGroups"></div>
			</div>
		</section>
	</main>
</div>

<script type="module">
	import { requireAdmin, getSupabase, onAuthChange, logoutAndGo } from './Javascript/adminAuth.js?v=20261212';

	const $ = (id) => document.getElementById(id);
	const esc = (s) => String(s ?? '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');

	document.getElementById('logoutBtn').onclick = () => logoutAndGo('./');

	// 點城市 pill → 地圖定位到該城市
	const geoListEl = document.getElementById('geoList');
	if (geoListEl) geoListEl.addEventListener('click', (e) => {
		const btn = e.target.closest('.geo-btn');
		if (!btn || btn.disabled || !map) return;
		const center = cityCenters[btn.dataset.city];
		if (center && Number.isFinite(center[0]) && Number.isFinite(center[1])) {
			userFocusedCity = true;
			map.setView(center, 12, { animate: true });
		}
	});

	const pageDetailClose = document.getElementById('topPagesDetailClose');
	if (pageDetailClose) pageDetailClose.addEventListener('click', () => {
		selectedPageCategory = null;
		const b = $('topPagesDetail');
		if (b) b.style.display = 'none';
	});

	let chartTrend = null;
	let chartPages = null;
	let map = null;
	let itemsCache = [];
	let postsMapCache = new Map();
	let servicesMapCache = new Map();
	let topPagesSorted = [];
	let selectedPageCategory = null;
	let cityCenters = {};
	let userFocusedCity = false;

	// ---------- helpers ----------
	async function fetchJson(url) {
		try {
			const r = await fetch(url + '?t=' + Date.now(), { cache: 'no-store' });
			if (!r.ok) return [];
			const d = await r.json();
			return Array.isArray(d) ? d : [];
		} catch (e) { return []; }
	}

	function parseQuery(url) {
		const out = {};
		try {
			const u = new URL(url, window.location.origin);
			u.searchParams.forEach((v, k) => { out[k] = v; });
		} catch (e) {}
		return out;
	}

	function simplifyPage(url) {
		const path = url.split('?')[0].replace(/\/?index\.html$/, '/').replace(/\/+/g, '/');
		if (path === '/') return '首頁';
		if (path.startsWith('/ghoststory/article/')) return '日誌文章';
		if (path === '/ghoststory/' || path === '/ghoststory') return '日誌首頁';
		if (path.startsWith('/services/compendium/detail.html')) return '彙典';
		if (path.startsWith('/services/compendium')) return '彙典首頁';
		if (path.startsWith('/services/notices')) return '公告';
		if (path === '/services/' || path === '/services') return '服務首頁';
		if (path.startsWith('/services/consult')) return '諮詢表單';
		return path;
	}

	// 產生「可點擊的頁面詳情」HTML：文章/彙典帶入 JSON 標題，否則顯示頁面名稱並連結
	const pageLink = (href, text) => `<a class="ev-link" href="${esc(href)}" target="_blank" rel="noopener">${text}</a>`;

	function pageDetailHtml(rawUrl, postsMap, servicesMap) {
		const url = rawUrl || '/';
		const path = url.split('?')[0].replace(/\/?index\.html$/, '/').replace(/\/+/g, '/');
		const q = parseQuery(url);
		const fromNotice = q.from === 'notices';
		const noticeTag = fromNotice ? ' <span class="from-tag">公告來源</span>' : '';

		if (path.startsWith('/ghoststory/article/') && q.id) {
			const pid = String(q.id);
			const postId = pid.includes('_') ? pid.split('_')[0] : pid;
			const p = postsMap.get(String(postId));
			const title = (p && p['標題']) ? String(p['標題']) : `ID ${pid}`;
			return pageLink(`/ghoststory/article/${encodeURIComponent(pid)}.html`, `日誌文章：${esc(title)}`) + noticeTag;
		}
		if (path.startsWith('/services/compendium/detail.html') && q.id) {
			const s = servicesMap.get(String(q.id));
			const title = (s && s['標題']) ? String(s['標題']) : `ID ${q.id}`;
			return pageLink(`/services/compendium/${encodeURIComponent(q.id)}.html`, `彙典：${esc(title)}`) + noticeTag;
		}
		// 其他固定頁面：顯示名稱並可點擊（保持原路徑）
		return pageLink(path, esc(simplifyPage(url))) + noticeTag;
	}

	// 依正規化 URL 分組（文章/彙典以 id 為鍵，忽略 from=notices 等 utm 差異）
	function normalizePageKey(url) {
		const raw = url || '/';
		const path = raw.split('?')[0].replace(/\/?index\.html$/, '/').replace(/\/+/g, '/');
		const q = parseQuery(raw);
		const idPaths = ['/ghoststory/article/', '/services/compendium/detail.html', '/services/'];
		if (q.id && idPaths.some(p => path.startsWith(p))) return path + '?id=' + q.id;
		if (path.startsWith('/services/notices')) return '/services/notices' + (q.from ? '?from=' + q.from : '');
		return path;
	}

	function breakdownNameHtml(key) {
		const [path, qs] = key.split('?');
		const q = parseQuery('?' + (qs || ''));
		const idNote = (id) => ` <span style="font-size:11px;color:#b0a08d;">${esc(id)}</span>`;
		if (path.startsWith('/ghoststory/article/') && q.id) {
			const pid = String(q.id);
			const postId = pid.includes('_') ? pid.split('_')[0] : pid;
			const p = postsMapCache.get(String(postId)) || {};
			const title = p['標題'] || `PostID ${postId}`;
			return pageLink(`/ghoststory/article/${encodeURIComponent(pid)}.html`, `日誌文章：${esc(title)}`) + idNote(pid);
		}
		if (path.startsWith('/services/compendium/detail.html') && q.id) {
			const s = servicesMapCache.get(String(q.id)) || {};
			const title = s['標題'] || `ID ${q.id}`;
			return pageLink(`/services/compendium/${encodeURIComponent(q.id)}.html`, `彙典：${esc(title)}`) + idNote(q.id);
		}
		return pageLink(key, esc(simplifyPage(key)));
	}

	// 點柱狀圖後：顯示該分類每個頁面的明細（瀏覽/累積/平均/最長）
	function renderTopPagesDetail(cat) {
		const box = $('topPagesDetail');
		if (!box) return;
		const groups = {};
		itemsCache.forEach(i => {
			if (simplifyPage(i.page_url || '/') !== cat) return;
			const key = normalizePageKey(i.page_url || '/');
			if (!groups[key]) groups[key] = { key, views: 0, totalStay: 0, leaves: 0, maxStay: 0 };
			const g = groups[key];
			if (i.event_name === 'Page_View') g.views++;
			if (i.event_name === 'Page_Leave' && i.stay_time_seconds != null) {
				const s = Number(i.stay_time_seconds) || 0;
				g.totalStay += s;
				g.leaves++;
				if (s > g.maxStay) g.maxStay = s;
			}
		});
		const rows = Object.values(groups).sort((a, b) => (b.views - a.views) || (b.totalStay - a.totalStay));
		const totals = rows.reduce((acc, r) => { acc.views += r.views; acc.totalStay += r.totalStay; return acc; }, { views: 0, totalStay: 0 });
		$('topPagesDetailTitle').innerHTML = `${esc(cat)} 頁面明細（${rows.length} 頁 · 共 ${totals.views} 次瀏覽 · 累積停留 ${totals.totalStay}s）`;
		$('topPagesDetailBody').innerHTML = rows.length
			? `<div class="page-detail-scroll"><table class="data"><thead><tr><th>頁面</th><th>瀏覽</th><th>累積秒數</th><th>平均停留</th><th>最長停留</th></tr></thead><tbody>`
				+ rows.map(r => `<tr><td>${breakdownNameHtml(r.key)}</td><td>${r.views} 次</td><td>${r.totalStay}s</td><td>${r.leaves ? Math.round(r.totalStay / r.leaves) + 's' : '-'}</td><td>${r.maxStay}s</td></tr>`).join('')
				+ `</tbody><tfoot><tr><th>合計</th><th>${totals.views} 次</th><th>${totals.totalStay}s</th><th>–</th><th>–</th></tr></tfoot></table></div>`
			: '<div style="color:#8b7355;">此分類尚無資料</div>';
		box.style.display = 'block';
	}

	function shortSessionId(sid) {
		if (!sid) return '-';
		const head = sid.split('_')[0] || sid;
		return head.slice(-6);
	}

	async function loadAnalytics() {
		const days = Number($('rangeSelect').value) || 7;
		const sb = await getSupabase();
		const since = new Date();
		since.setDate(since.getDate() - days);
		const sinceIso = since.toISOString();
		try {
			const [eventsRes, posts, services] = await Promise.all([
				sb.from('user_events').select('*').gte('created_at', sinceIso).order('created_at', { ascending: true }),
				fetchJson('/Data/postFB.json'),
				fetchJson('/Data/Services.json')
			]);
			if (eventsRes.error) throw eventsRes.error;
			refreshUI(eventsRes.data || [], posts || [], services || [], days);
		} catch (e) {
			$('eventRows').innerHTML = `<tr><td colspan="6">讀取失敗：${esc(e.message || String(e))}</td></tr>`;
		}
	}

	// ---------- refresh UI ----------
	function refreshUI(items, postsArr, servicesArr, days) {
		const postsMap = new Map();
		(postsArr || []).forEach(p => { if (p.PostID != null) postsMap.set(String(p.PostID), p); });
		const announcementIds = new Set();
		(postsArr || []).forEach(p => { if (String(p['標題'] || '').startsWith('【公告】')) announcementIds.add(String(p.PostID)); });

		const servicesMap = new Map();
		(servicesArr || []).forEach(s => { if (s.ID) servicesMap.set(String(s.ID), s); });

		const total = items.length;
		const uniqueSessions = new Set(items.map(i => i.session_id).filter(Boolean)).size;
		const uniquePages = new Set(items.map(i => simplifyPage(i.page_url || '/'))).size;
		const stays = items.filter(i => i.event_name === 'Page_Leave' && i.stay_time_seconds != null).map(i => i.stay_time_seconds || 0);
		const totalStay = stays.reduce((a, b) => a + b, 0);
		const avg = stays.length ? Math.round(totalStay / stays.length) : 0;
		const today = items.filter(i => new Date(i.created_at).toDateString() === new Date().toDateString()).length;

		// map simplified category → count（只計算 Page_View，一次瀏覽算一次）
		const pageCount = {};
		items.forEach(i => {
			if (i.event_name !== 'Page_View') return;
			const p = simplifyPage(i.page_url || '/');
			if (p) pageCount[p] = (pageCount[p] || 0) + 1;
		});

		// map city counts for geo list（不重複訪客人數，非瀏覽次數）+ 各城市平均座標（供點擊定位）
		const cityMap = {};
		items.forEach(i => {
			const c = (i.city || i.country_name || '').trim();
			if (!c) return;
			if (!cityMap[c]) cityMap[c] = { sessions: new Set(), noSession: 0, lat: 0, lng: 0, coordCount: 0 };
			const entry = cityMap[c];
			if (i.session_id) entry.sessions.add(i.session_id);
			else entry.noSession++;
			const lat = Number(i.latitude), lng = Number(i.longitude);
			if (Number.isFinite(lat) && Number.isFinite(lng)) {
				entry.lat += lat;
				entry.lng += lng;
				entry.coordCount++;
			}
		});
		cityCenters = {};
		const geoList = Object.entries(cityMap)
			.map(([name, v]) => {
				if (v.coordCount) cityCenters[name] = [v.lat / v.coordCount, v.lng / v.coordCount];
				return { name, count: v.sessions.size + v.noSession };
			})
			.sort((a, b) => b.count - a.count)
			.slice(0, 20);
		$('geoList').innerHTML = geoList.map(g => {
			const coords = cityCenters[g.name];
			const title = coords ? `點擊定位到 ${g.name}` : '無座標資料';
			const disabled = coords ? '' : ' disabled';
			return `<button class="geo-pill geo-btn" type="button" data-city="${esc(g.name)}" title="${esc(title)}"${disabled}>${esc(g.name)} · ${g.count} 人</button>`;
		}).join('') || '<span style="color:#8b7355;">尚無地理資料</span>';
		$('totalViews').innerText = total;
		$('uniqueVisitors').innerText = uniqueSessions;
		$('uniquePages').innerText = uniquePages;
		$('totalStay').innerText = totalStay + 's';
		$('avgStay').innerText = avg + 's';
		$('todayViews').innerText = today;
		$('uniqueVisitorsLarge').innerText = uniqueSessions;

		itemsCache = items;
		postsMapCache = postsMap;
		servicesMapCache = servicesMap;

		// --- Top pages chart ---
		const sorted = Object.entries(pageCount).sort((a, b) => b[1] - a[1]).slice(0, 10);
		topPagesSorted = sorted;
		const ctx2 = $('topPagesChart').getContext('2d');
		if (chartPages) chartPages.destroy();
		chartPages = new Chart(ctx2, {
			type: 'bar',
			data: {
				labels: sorted.map(([p]) => p),
				datasets: [{
					label: '瀏覽次數',
					data: sorted.map(([_, c]) => c),
					backgroundColor: '#8b7355'
				}]
			},
			options: {
				responsive: true,
				maintainAspectRatio: false,
				plugins: { legend: { display: false } },
				scales: { y: { beginAtZero: true, ticks: { precision: 0 } } },
				onHover: (evt, elements) => { const t = evt?.native?.target; if (t) t.style.cursor = elements.length ? 'pointer' : 'default'; },
				onClick: (evt, elements) => {
					if (!elements || !elements.length) return;
					const idx = elements[0].index;
					const cat = topPagesSorted[idx] && topPagesSorted[idx][0];
					if (!cat) return;
					selectedPageCategory = cat;
					renderTopPagesDetail(cat);
				}
			}
		});

		// 重新載入後若先前有選取的分類，保持明細區塊顯示
		if (selectedPageCategory && pageCount[selectedPageCategory] != null) {
			renderTopPagesDetail(selectedPageCategory);
		} else if (selectedPageCategory) {
			selectedPageCategory = null;
			const b = $('topPagesDetail');
			if (b) b.style.display = 'none';
		}

		// --- Trend chart ---
		const dayMap = {};
		for (let i = days - 1; i >= 0; i--) {
			const d = new Date();
			d.setDate(d.getDate() - i);
			dayMap[d.toLocaleDateString('zh-TW', { month: 'numeric', day: 'numeric' })] = 0;
		}
		items.forEach(i => {
			const dStr = new Date(i.created_at).toLocaleDateString('zh-TW', { month: 'numeric', day: 'numeric' });
			if (dayMap[dStr] !== undefined) dayMap[dStr]++;
		});
		const ctx = $('trendChart').getContext('2d');
		if (chartTrend) chartTrend.destroy();
		chartTrend = new Chart(ctx, {
			type: 'line',
			data: {
				labels: Object.keys(dayMap),
				datasets: [{
					label: '瀏覽次數',
					data: Object.values(dayMap),
					borderColor: '#8b7355',
					backgroundColor: 'rgba(139, 115, 85, 0.2)',
					fill: true,
					tension: 0.4
				}]
			},
			options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } }, scales: { y: { beginAtZero: true, ticks: { precision: 0 } } } }
		});

		// --- Heatmap ---
		const points = items
			.filter(i => i.latitude != null && i.longitude != null)
			.map(i => [Number(i.latitude), Number(i.longitude), Math.max(1, i.stay_time_seconds || 1)]);
		if (map) { map.remove(); map = null; }
		if (points.length > 0) {
			try {
				map = L.map('map', { zoomControl: true }).setView([23.5, 121], 4);
				L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 18, attribution: '&copy; OpenStreetMap contributors' }).addTo(map);
				map.invalidateSize();

				const drawOverlays = () => {
					try {
						L.heatLayer(points, { radius: 35, blur: 25, maxZoom: 12 }).addTo(map);
					} catch (e) {
						console.warn('熱力圖繪製失敗：', e);
					}
					try {
						const bounds = L.latLngBounds(points.map(p => [p[0], p[1]]));
						if (!userFocusedCity && bounds.isValid()) map.fitBounds(bounds.pad(0.2));
					} catch (e) {
						console.warn('fitBounds 失敗：', e);
					}
				};

				// 等地圖 size 算好、瀏覽器畫完下一幀再畫熱力圖，避免 canvas 寬度為 0
				if (typeof map.whenReady === 'function') {
					map.whenReady(() => requestAnimationFrame(drawOverlays));
				} else {
					requestAnimationFrame(drawOverlays);
				}
			} catch (e) {
				console.warn('地圖初始化失敗：', e);
			}
		}

		// --- Top articles & compendium (Top 100) ---
		const articleCount = {};
		const compendiumCount = {};
		items.forEach(i => {
			const p = i.page_url || '/';
			const q = parseQuery(p);
			const pid = q.id ? String(q.id) : '';
			const postId = pid.includes('_') ? pid.split('_')[0] : pid;
			const isFromNotices = (q.from === 'notices') || (postId && announcementIds.has(postId));
			if (p.startsWith('/ghoststory/article/') && postId && !isFromNotices) {
				articleCount[pid] = (articleCount[pid] || 0) + 1;
			} else if (p.startsWith('/services/compendium/detail.html') && pid) {
				compendiumCount[pid] = (compendiumCount[pid] || 0) + 1;
			}
		});

		const articleRank = Object.entries(articleCount)
			.sort((a, b) => b[1] - a[1])
			.slice(0, 100)
			.map(([id, count]) => {
				const postId = id.includes('_') ? id.split('_')[0] : id;
				const p = postsMap.get(String(postId)) || {};
				const title = p['標題'] || `PostID ${postId}`;
				const url = `/ghoststory/article/${encodeURIComponent(id)}.html`;
				const excerpt = (p['貼文內容'] || '').replace(/<[^>]*>/g, ' ').replace(/\s+/g, ' ').slice(0, 80).trim();
				return { id, title, url, excerpt, count };
			});
		$('topArticles').innerHTML = articleRank.length ? '<ol class="rank-list">' + articleRank.map((r, i) => `
			<li class="rank-item">
				<div class="rank-num">${i + 1}</div>
				<div class="rank-body">
					<div class="rank-title">${esc(r.title)}</div>
					${r.excerpt ? `<div class="rank-desc">${esc(r.excerpt)}</div>` : ''}
					<div class="rank-meta">瀏覽 ${r.count} 次 · <a href="${esc(r.url)}" target="_blank" rel="noopener">查看文章</a></div>
				</div>
			</li>
		`).join('') : '<div style="color:#8b7355;">尚無文章資料</div>';

		const compendiumRank = Object.entries(compendiumCount)
			.sort((a, b) => b[1] - a[1])
			.slice(0, 100)
			.map(([id, count]) => {
				const s = servicesMap.get(String(id)) || {};
				const title = s['標題'] || `ID ${id}`;
				const url = `/services/compendium/${encodeURIComponent(id)}.html`;
				const excerpt = (s['貼文內容'] || '').replace(/<[^>]*>/g, ' ').replace(/\s+/g, ' ').slice(0, 80).trim();
				return { id, title, url, excerpt, count };
			});
		$('topCompendium').innerHTML = compendiumRank.length ? '<ol class="rank-list">' + compendiumRank.map((r, i) => `
			<li class="rank-item">
				<div class="rank-num">${i + 1}</div>
				<div class="rank-body">
					<div class="rank-title">${esc(r.title)}</div>
					${r.excerpt ? `<div class="rank-desc">${esc(r.excerpt)}</div>` : ''}
					<div class="rank-meta">瀏覽 ${r.count} 次 · <a href="${esc(r.url)}" target="_blank" rel="noopener">查看彙典</a></div>
				</div>
			</li>
		`).join('') : '<div style="color:#8b7355;">尚無彙典資料</div>';

		const recent = [...items].slice(-100).reverse();
		$('eventRows').innerHTML = recent.map(i => {
			const t = new Date(i.created_at).toLocaleString('zh-TW', { timeZone: 'Asia/Taipei' });
			const pos = [i.city, i.region, i.country_name].filter(Boolean).join(' · ');
			const session = shortSessionId(i.session_id);
			const pageName = simplifyPage(i.page_url || '/');
			return `<tr><td>${esc(t)}</td><td>${esc(i.event_name || '-')}</td><td>${esc(pageName)}</td><td>${i.stay_time_seconds != null ? esc(i.stay_time_seconds + 's') : '-'}</td><td>${esc(pos || '-')}</td><td><span class="path-tag">${esc(session)}</span></td></tr>`;
		}).join('') || '<tr><td colspan="6">（空）</td></tr>';

		const sessionMap = {};
		items.forEach(i => {
			const sid = i.session_id || 'unknown';
			if (!sessionMap[sid]) sessionMap[sid] = [];
			sessionMap[sid].push(i);
		});
		const fmtDT = (iso) => { try { return new Date(iso).toLocaleString('zh-TW', { timeZone: 'Asia/Taipei', month: 'numeric', day: 'numeric', hour: '2-digit', minute: '2-digit' }); } catch (e) { return ''; } };
		const sessions = Object.entries(sessionMap).sort((a, b) => (b[1][b[1].length - 1] || {}).created_at?.localeCompare((a[1][a[1].length - 1] || {}).created_at) || 0);
		$('visitorGroups').innerHTML = sessions.map(([sid, events]) => {
			const totalStayTime = events.reduce((s, e) => s + (e.stay_time_seconds || 0), 0);
			const first = events[0];
			const latest = events[events.length - 1] || first;
			const latestStr = latest ? new Date(latest.created_at).toLocaleString('zh-TW', { timeZone: 'Asia/Taipei' }) : '';
			const firstStr = first ? fmtDT(first.created_at) : '';
			const locParts = [latest?.country_name, latest?.region, latest?.city].filter(Boolean);
			const loc = locParts.filter((p, i, arr) => i === 0 || String(p).trim().toLowerCase() !== String(arr[i - 1]).trim().toLowerCase()).join(' · ');
			const viewCount = events.filter(e => e.event_name === 'Page_View').length;
			const pageCounter = {};
			events.forEach(e => { const k = simplifyPage(e.page_url || '/'); pageCounter[k] = (pageCounter[k] || 0) + 1; });
			const pages = Object.entries(pageCounter).sort((a, b) => b[1] - a[1]).map(([k, v]) => `${k}×${v}`).join('、');
			const uniquePageCount = Object.keys(pageCounter).length;
			const eventsHtml = `
				<div class="visitor-meta">
					<span>首次來訪：${esc(firstStr)}</span>
					<span>造訪頁面：${uniquePageCount} 頁</span>
					<span>位置：${esc(loc || '未知')}</span>
				</div>` + events.slice().reverse().map(e => {
				const et = new Date(e.created_at).toLocaleTimeString('zh-TW', { timeZone: 'Asia/Taipei', hour: '2-digit', minute: '2-digit' });
				const dur = e.stay_time_seconds != null ? e.stay_time_seconds + 's' : '-';
				return `<div class="visitor-event"><span style="color:#8b7355;">${esc(et)}</span><span class="path-tag">${esc(e.event_name)}</span><span>${pageDetailHtml(e.page_url, postsMap, servicesMap)}</span><span style="color:#5c4332;">${esc(dur)}</span></div>`;
			}).join('');
			return `
				<div class="visitor-group">
					<div class="visitor-header" data-sid="${esc(sid)}">
						<span style="color:#8b7355;">#${esc(shortSessionId(sid))}</span>
						<span style="flex:1;color:#4a2e1b;">${esc(loc || '未知位置')} · ${esc(pages)}</span>
						<span style="font-size:12px;color:#5c4332;">${events.length} 次（瀏覽 ${viewCount}） · ${totalStayTime}s · ${esc(latestStr)}</span>
						<span class="toggle-arrow">▶</span>
					</div>
					<div class="visitor-body" id="vb-${esc(sid)}">${eventsHtml}</div>
				</div>
			`;
		}).join('') || '<div style="color:#8b7355;">尚無訪客資料</div>';

		$('visitorGroups').querySelectorAll('.visitor-header').forEach(header => {
			header.addEventListener('click', () => {
				const sid = header.dataset.sid;
				const body = document.getElementById('vb-' + sid);
				if (body) body.classList.toggle('open');
				const arrow = header.querySelector('.toggle-arrow');
				if (arrow) arrow.textContent = body && body.classList.contains('open') ? '▼' : '▶';
			});
		});
	}

	// Hamburger toggle
	const layout = document.querySelector('.analytics-layout');
	const menuToggle = document.getElementById('menuToggle');
	const menuOverlay = document.getElementById('menuOverlay');
	if (menuToggle && layout) {
		menuToggle.addEventListener('click', () => layout.classList.toggle('menu-open'));
	}
	if (menuOverlay && layout) {
		menuOverlay.addEventListener('click', () => layout.classList.remove('menu-open'));
	}

	// Sidebar tabs（點任一個 panel 都關閉選單）
	document.querySelectorAll('.sidebar-btn').forEach(btn => {
		btn.addEventListener('click', () => {
			if (layout) layout.classList.remove('menu-open');
			const panelId = btn.dataset.panel;
			document.querySelectorAll('.sidebar-btn').forEach(b => b.classList.toggle('active', b === btn));
			document.querySelectorAll('.panel').forEach(panel => {
				panel.classList.toggle('active', panel.id === panelId);
				panel.style.display = panel.id === panelId ? 'block' : 'none';
			});
		});
	});

	async function init() {
		try {
			const session = await requireAdmin('./');
			if (!session) return;
			$('adminUser').innerText = '已登入：' + (session.user?.email || '');
			await loadAnalytics();
		} catch (e) {
			$('adminUser').innerText = '驗證失敗：' + (e?.message || e);
		}
	}
	init();
	onAuthChange((_event, s) => { if (!s) location.replace('./'); });
</script>
</body>
</html>
